
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan Pernikahan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    overflow: hidden;
}

.cover {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background-image:
        linear-gradient(rgba(0,0,0,0.35),
                        rgba(0,0,0,0.45)),
        url("kover.jpg");

    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 25px;
}

.subtitle {
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.title {
    font-size: 42px;
    margin-bottom: 35px;
    line-height: 1.3;
}

.guest-label {
    font-size: 14px;
    margin-bottom: 10px;
}

.guest-name {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
}

.open-button {
    padding: 15px 35px;
    background: #b49a75;
    color: white;
    border: 1px solid white;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.open-button:hover {
    background: #8f7451;
    transform: scale(1.05);
}

.music-info {
    position: absolute;
    bottom: 20px;
    font-size: 11px;
    letter-spacing: 1px;
}

@media(max-width:480px) {
    .title {
        font-size: 34px;
    }

    .guest-name {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="cover">

    <p class="subtitle">THE WEDDING OF</p>

    <h1 class="title">
        Vegi<br>&<br>Jamil
    </h1>

    <p class="guest-label">
        Kepada Yth. Bapak/Ibu/Saudara/i
    </p>

    <p class="guest-name" id="guestName">
        Tamu Undangan
    </p>

    <button class="open-button" onclick="openInvitation()">
        ✉ Buka Undangan
    </button>

    <p class="music-info">
        WITH LOVE AND BLESSING
    </p>

</div>

<!-- MUSIK -->
<audio id="music" loop preload="auto">
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<script>

// =================================
// 1. LINK WEBSITE UNDANGAN ASLI
// =================================

const invitationURL = vegidanjamil2027.my.canva.site/weddinginvitation⁠
(terbuka di tab atau jendela baru)";


// =================================
// 2. MEMBACA NAMA TAMU DARI LINK
// =================================

const params = new URLSearchParams(
    window.location.search
);

const guest = params.get("to") || "Tamu Undangan";

document.getElementById("guestName").textContent = guest;


// =================================
// 3. BUKA UNDANGAN + PUTAR MUSIK
// =================================

function openInvitation() {

    const music = document.getElementById("music");

    // Simpan posisi musik dan putar
    music.play().then(() => {

        // Setelah musik berhasil diputar,
        // pindah ke website undangan asli

        setTimeout(() => {
            window.location.href =
                invitationURL +
                (invitationURL.includes("?") ? "&" : "?") +
                "to=" + encodeURIComponent(guest);

        }, 300);

    }).catch(error => {

        // Jika musik gagal diputar,
        // tetap buka website undangan

        window.location.href =
            invitationURL +
            (invitationURL.includes("?") ? "&" : "?") +
            "to=" + encodeURIComponent(guest);

    });

}

</script>

</body>
</html>
